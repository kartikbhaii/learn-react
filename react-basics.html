<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- including react (which is external library of javascript) -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!--  including babel that convert JSX(jsx: help us write HTML-syntax-code inside JavaScript, but browser understands js so we need to convert jsx into js and we use babel) into JS -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      const button = <button>hello</button>;
      const para = <p>paragraph of text</p>;

      const div = 
      (
        <div>
          <button>hello</button>
          <p>paragraph of text</p>
        </div>
      );

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(div);
    </script>
  </body>
</html>
